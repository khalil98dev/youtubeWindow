name: custom_windows
description: "YouTube Premium Viewer - Background Play, Ad-Free & Offline Downloads."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  audioplayers: ^6.8.1
  cupertino_ui: ^1.0.2
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_windows: ^1.3.0
  window_manager: ^0.5.2
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
